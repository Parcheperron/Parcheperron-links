<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><meta name="description" content="Encuentra tu sede Parche Perrón, pide domicilio, cotiza eventos y contáctanos."><title>Parche Perrón | Encuentra tu parche</title><style>
@font-face{font-family:Parche;src:url('./assets/tipografia-parche.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;color:#fff;background:#111;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background-image:radial-gradient(circle at 20% 25%,#ffffff0b 0 1px,transparent 2px),radial-gradient(circle at 70% 65%,#ffffff09 0 1px,transparent 2px),repeating-linear-gradient(118deg,#ffffff04 0 1px,transparent 1px 9px),linear-gradient(140deg,#171717,#090909);background-size:31px 29px,47px 41px,auto,auto;min-height:100vh}main{width:min(100% - 32px,480px);margin:auto;padding:32px 0 48px}.hero{text-align:center;padding:20px 12px 26px}.logo{display:block;max-width:min(100%,340px);max-height:240px;object-fit:contain;margin:0 auto 12px}.brand{font-family:Parche,Impact,'Arial Black',sans-serif;color:#ffcb24;font-size:clamp(34px,9vw,48px);line-height:1.04;margin:8px 0}.tagline{font-weight:800;letter-spacing:.04em;margin:12px 0 6px}.muted{color:#c2c2c2;font-size:14px}.heading{font-size:16px;font-weight:900;color:#ffcb24;letter-spacing:.05em;margin:12px 0 6px}.stack{display:grid;gap:11px}.branch{background:#232323;border:1px solid #373737;border-radius:14px;overflow:hidden}.branch summary{list-style:none;cursor:pointer;padding:17px;display:flex;align-items:center;gap:12px;font-weight:800}.branch summary::-webkit-details-marker{display:none}.branch summary:after{content:'⌄';margin-left:auto;color:#ffcb24;font-size:22px}.branch[open] summary:after{content:'⌃'}.marker{background:#ffcb24;color:#111;border-radius:9px;padding:9px}.actions{display:grid;gap:8px;padding:0 13px 13px}.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:10px;padding:14px 16px;text-decoration:none;font-weight:800;background:#343434;color:white}.btn.primary{background:#ffcb24;color:#161616}.btn:hover,.branch summary:hover{filter:brightness(1.12)}.btn.disabled{opacity:.55;cursor:not-allowed}.feature{background:#ffcb24;color:#151515;border-radius:14px;padding:18px;margin:22px 0}.feature h2{font-size:17px;margin:0 0 6px}.feature p{margin:0 0 14px;font-size:14px}.feature .btn{background:#161616;color:#ffcb24}.extras{display:grid;gap:10px;margin-top:16px}.extras .btn{border:1px solid #474747}.footer{text-align:center;color:#aaa;font-size:12px;margin-top:28px}.note{color:#bdbdbd;font-size:12px;margin:6px 0 0}.small{font-size:12px;color:#aaa;font-weight:500}
</style></head><body><main><header class="hero"><img class="logo" src="./assets/logo-parcheperron.png" alt="Logotipo oficial de Parche Perrón" onload="document.querySelector('.brand').style.display='none'" onerror="this.style.display='none'"><h1 class="brand">PARCHE PERRÓN</h1><p class="tagline">EL PARCHE MÁS PERRÓN DE TODOS 😎</p><p class="muted">🌭 Buenos perros, buenos parches.</p></header><h2 class="heading">ENCUENTRA TU PARCHE</h2><p class="muted">Selecciona tu sede para pedir o visitarnos.</p><section class="stack" id="sedes"></section><section class="feature"><h2>🎉 ¿TIENES UN EVENTO?</h2><p>¡Llevamos el parche hasta donde estés!</p><a class="btn" id="eventos">Cotiza nuestro carrito ↗</a></section><h2 class="heading">SIGAMOS PARCHANDO</h2><section class="extras" id="extras"></section><footer class="footer">© Parche Perrón · Hecho para parchar 🌭</footer></main><script src="./config.js"></script><script>
const link=(label,url,primary=false)=>{const a=document.createElement('a');a.className='btn'+(primary?' primary':'')+(url?'':' disabled');a.textContent=label+' ↗';if(url){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}else{a.removeAttribute('href');a.setAttribute('aria-disabled','true');a.title='Enlace pendiente de configurar'}return a};
const wa=(value,message)=>{if(!value)return null;if(/^https?:\/\//.test(value))return value;const number=value.replace(/\D/g,'');return 'https://wa.me/'+number+'?text='+encodeURIComponent(message)};
const root=document.getElementById('sedes');config.sedes.forEach((s,i)=>{const d=document.createElement('details');d.className='branch';const sum=document.createElement('summary');const mark=document.createElement('span');mark.className='marker';mark.textContent='⌖';const title=document.createElement('span');title.textContent=s.nombre.toUpperCase();if(s.detalle){const detail=document.createElement('div');detail.className='small';detail.textContent=s.detalle;title.append(detail)}sum.append(mark,title);d.append(sum);const actions=document.createElement('div');actions.className='actions';actions.append(link(s.proximamente?'Domicilios próximamente':'💬 Pedir domicilio',s.proximamente?null:wa(s.whatsapp,'Hola, quiero pedir un domicilio en '+s.nombre),true));actions.append(link('📍 Cómo llegar',s.maps));d.append(actions);root.append(d);d.addEventListener('toggle',()=>{if(d.open)root.querySelectorAll('details').forEach(other=>{if(other!==d)other.open=false})})});
const eventLink=document.getElementById('eventos');eventLink.replaceWith(link('Cotiza nuestro carrito',wa(config.eventos,'Hola, quiero cotizar el carrito de Parche Perrón para un evento')));
const extras=document.getElementById('extras');[['◎ Instagram',config.instagram],['♫ TikTok',config.tiktok],['📄 Trabaja con nosotros',wa(config.empleo,'Hola, quiero enviar mi hoja de vida para trabajar en Parche Perrón.')],['💛 Tu opinión nos importa',wa(config.opiniones,'Hola, equipo de Parche Perrón. Quiero compartirles una opinión sobre mi experiencia.')]].forEach(([name,url])=>extras.append(link(name,url)));
</script></body></html>
